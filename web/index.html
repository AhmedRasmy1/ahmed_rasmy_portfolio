      text-align: center;

    }
    .boot-copy {
      max-width: 28rem;
      opacity: 0.92;
    }
    .boot-copy h1 {
      font-size: 1.35rem;

    }
    .boot-copy p {

      line-height: 1.45;
      font-size: 0.95rem;
      opacity: 0.85;
    }
    .boot-copy a {
      color: #13B9FD;
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-diamond { animation: none; }
    }
  </style>
